<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Magical Princess World</title>
<meta name="theme-color" content="#f6c9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Princess World">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-stage="world">
  <header class="top">
    <h1 class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l1.5-10-5.5 4L12 5 7 12 1.5 8z"/></svg>
      <span>Magical <b>Princess World</b></span>
    </h1>
    <nav id="steps" class="steps" aria-label="Main places"></nav>
    <div class="tools">
      <button id="btnSound" class="round" aria-label="Sound on or off"></button>
      <button id="btnSave" class="round" aria-label="Save this princess to my gallery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 15 2 12 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 4-3 7-10 13z"/></svg>
      </button>
      <button id="btnReset" class="round" aria-label="Start this princess over">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1L6.5 6 12 11V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="fx" aria-hidden="true"></div>

<dialog id="mixer" class="sheet">
  <h2>Potion colour mixer</h2>
  <p>Tap two potions to brew a brand new colour.</p>
  <div id="potions" class="potions"></div>
  <div class="brew">
    <span id="potA" class="drop"></span><i>+</i><span id="potB" class="drop"></span><i>=</i>
    <span id="potMix" class="cauldron"></span>
  </div>
  <div class="sheet-actions">
    <button class="btn ghost" data-close>Close</button>
    <button class="btn" id="mixUse" disabled>Use this colour</button>
  </div>
</dialog>

<dialog id="confirm" class="sheet">
  <h2>Start over?</h2>
  <p>This takes your princess back to her first look.</p>
  <div class="sheet-actions">
    <button class="btn ghost" data-close>Keep my look</button>
    <button class="btn" id="confirmYes">Start over</button>
  </div>
</dialog>

<dialog id="unlock" class="sheet">
  <div id="unlockArt" class="unlock-art"></div>
  <h2 id="unlockTitle"></h2>
  <p id="unlockText"></p>
  <div class="sheet-actions"><button class="btn" data-close>Hooray!</button></div>
</dialog>

<dialog id="path" class="sheet wide">
  <h2>Magical stars</h2>
  <p id="pathSub"></p>
  <div id="pathList" class="pathlist"></div>
  <div class="sheet-actions"><button class="btn" data-close>Close</button></div>
</dialog>

<dialog id="galdlg" class="sheet wide">
  <h2 id="galTitle"></h2>
  <div id="galBody"></div>
  <div class="sheet-actions" id="galActs"></div>
</dialog>

<div id="toolSprite" hidden aria-hidden="true"></div>

<script src="game.js"></script>
<script src="hair.js"></script>
<script src="salon.js"></script>
<script src="world.js"></script>
<script src="pets.js"></script>
<script src="castle.js"></script>
<script src="events.js"></script>
<script src="gallery.js"></script>
<script src="tail.js"></script>
<script src="ui.js"></script>
</body>
</html>
